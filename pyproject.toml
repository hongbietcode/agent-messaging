[project]
name = "agent-messaging"
version = "0.1.0"
description = "Local Claude Code and Codex messaging with planner and worker panels."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["skills/agent-messaging/scripts"]

